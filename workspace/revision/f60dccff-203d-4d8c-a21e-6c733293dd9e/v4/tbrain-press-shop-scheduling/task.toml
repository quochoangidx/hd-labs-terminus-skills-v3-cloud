expert_time_estimate_hours = 6
difficulty_explanation = "Each week is unrelated parallel-machine scheduling with sequence-dependent die changeovers, press tonnage eligibility, release times, weighted tardiness and maintenance windows that no changeover or run may overlap. Changeover cost and lateness pull in opposite directions: grouping a die family saves hours of changeover but pushes other families' jobs past their due times, and the maintenance windows make the timing of a sequence non-obvious (a job that no longer fits before a window slips past it, and the knock-on delay moves every later job). Each target sits 6 percent above the best schedule found for its week, so a production planner has to build a search that works on assignment and sequence together; dispatch rules like the shipped earliest-due-date planner land two to four times over target. The weeks are synthetic but modelled on a stamping line: six die families, a changeover matrix of 35-120 minutes between families and 10 minutes within one, presses of 200-800 t with different stroke rates, and one or two maintenance windows per press."
solution_explanation = "The reference schedules are the best found for each week. They come from a ruin-and-recreate search (solution/search/lns.py): remove a few jobs (random, one die family, jobs with nearby due times, or a run of consecutive jobs on one press), reinsert each at its cheapest position on any press with enough tonnage, occasionally skipping a position, and accept by simulated annealing; then an iterated local search (solution/search/ils.py: exhaustive relocation, swaps and moves of blocks of up to eight consecutive jobs, with small ruin-and-recreate kicks). Several seeds and restarts were pooled to find these best schedules, and each target adds 6 percent to them. To show a target is reachable within the agent's budget, one fresh session per week with a new seed, starting from nothing, ran lns.py for 70 minutes and then ils.py for 30 minutes on one core (about 1.7 core-hours per week, under the 2 cores x 4 hours the agent has); it reached 33983, 50087, 81637, 118759 against targets of 36021, 50812, 82360, 119648, all within target. Those four schedules are in solution/search/one-session/. solve.sh copies the four reference schedules and runs the checker on each."
verification_explanation = "The verifier reads the four schedule files as JSON data and runs them with its own copy of the press rules and its own copies of the weeks and targets, so nothing the agent edits under /app affects grading and no candidate code runs. For each week one test checks that the schedule is valid (a JSON object whose only key is presses, no press key given twice, no NaN or Infinity tokens, every job exactly once, on a press with enough tonnage, known ids) and one checks that its integer cost, computed by simulating changeovers, releases and maintenance windows, is at or below the target. The reference schedules pass all eight tests; the shipped planner's schedules cost 100000, 160603, 307200 and 410333 against targets of 36021, 50812, 82360 and 119648."
relevant_experience = "Production scheduling and operations research: sequence-dependent setup scheduling on parallel machines, weighted tardiness objectives, and large-neighbourhood search for shop-floor planning."

