expert_time_estimate_hours = 12
difficulty_explanation = "A drop-in GNU ed 1.19 has to reproduce a stateful line editor from its manual with no ed to compare against: every address form, including relative offsets, marks, wrapping regex searches and the rule that a semicolon moves the current address before the next address is read; the exact current address after every command; undo that can itself be undone and that treats a whole global command as one step; global commands whose active list drops lines the command list touches; interactive G and V reading command lists from standard input; substitution with counts, the repeat form and line splitting; the cut buffer; and a POSIX regular-expression engine that takes the leftmost and then the longest match, which Python's re does not do. Errors matter as much as success: ed prints a question mark, stops at the first error when its commands come from a regular file but carries on when they come from a pipe, and warns once before quitting a modified buffer. The expertise is reading these rules exactly; an engineer who implements ed from memory gets the current-address, undo, destination and exit-status details wrong while everything else passes. The graded scripts are ed command scripts written for this task and generated from its command grammar, over small text fixtures written with them; no external corpus is involved, and the expected result of each one is produced by running GNU ed 1.19 itself at grading time rather than stored."
solution_explanation = "The reference is a standard-library port of the editor model in two files. posixre.py parses basic and extended regular expressions with the GNU escapes and matches them with an exhaustive backtracking search that keeps the leftmost start and the longest end. ed.py keeps the buffer as a circular list of line nodes and an undo stack of add, delete and move records that relink those nodes, so undo, undo of undo, marks and the global active list behave as the manual describes; it parses addresses and commands with their suffixes, runs g, v, G and V over an active list, applies substitutions with counts, the repeat form and line splitting, and prints question marks and sets the exit status according to whether standard input is a regular file and whether -l is given."
verification_explanation = "A separate verifier image holds the command scripts, one per line in a file per area of the manual, with their input files shared through a named fixture table and the roster of families and counts committed beside them; collection fails unless what loads matches that roster exactly. Each case carries its options, its fixture and the kind of standard input (a pipe or a regular file). For every case the verifier runs the image's own GNU ed 1.19 as root in a fresh directory to get the expected output, then runs /app/pyed/ed.py as an unprivileged user in another fresh copy of the same files with LC_ALL=C. It compares standard output byte for byte, whether the exit status is zero, and the names and contents of every file left in the directory. The ed binary is made root-only first, and the candidate runs through a launcher that ends the run if the program starts another process, loads native code or imports a module from outside the standard library and its own delivered files, so delegating to an ed binary or to a third-party package fails every case rather than passing them; the launcher is itself checked against five probe programs, one of them a call into the C library, and a separate test reads the delivered package and rejects a binary, an unparsable source or an import that is neither the standard library nor part of the package. Cases are grouped into one named test per area of the manual plus eight buckets of generated scripts. A generated case is kept only if its result does not change under any other plausible reading of a point the manual leaves open, and the cases written for a particular rule follow what the manual states about that rule."
relevant_experience = "Years of Unix systems work: maintaining shell and ed/sed scripts that edit configuration files in place, porting command-line tools to minimal containers, and implementing regular-expression engines with POSIX leftmost-longest semantics."

