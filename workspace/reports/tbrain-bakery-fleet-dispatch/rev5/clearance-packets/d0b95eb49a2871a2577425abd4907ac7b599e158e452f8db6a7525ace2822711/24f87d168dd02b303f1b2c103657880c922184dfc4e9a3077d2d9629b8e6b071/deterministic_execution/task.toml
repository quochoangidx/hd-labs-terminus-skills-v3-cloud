artifacts = ["/app/plans/"]
name = "tbrain-bakery-fleet-dispatch"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "advanced"
category = "Operations"
subcategory = "Logistics"
languages = ["python"]
tags = ["vehicle-routing", "time-windows", "heterogeneous-fleet", "metaheuristics", "dispatch-planning"]
expert_time_estimate_hours = 4
difficulty_explanation = "Each morning is a heterogeneous-fleet vehicle routing problem with hard delivery windows, per-kind capacity, pace, shift length and range limits, fixed costs that dominate distance costs, and a limited count of each vehicle kind. Each target is the dearest result of three independent 40-minute single-core runs of a string-removal large-neighbourhood search, and sits 40 to 50 percent below the shipped planner's cost, so a plan that is merely good fails: construction heuristics and route-by-route local search stall several percent above it. A routing engineer has to build a search that trades vehicle count against vehicle kind and distance at the same time, because the cheapest route on one kind is often not the cheapest plan once the fleet counts bind; has to choose departure times so long routes stay inside a shift without making an early-window stop late; and has to keep improving past the plateau where insertion heuristics and single-customer relocation stop, which takes moves that remove and rebuild several routes at once. The orders are synthetic but modelled on a wholesale bakery: clustered city customers, early market-hall windows, cafes with narrow morning windows, cargo bikes, vans and trucks. In practice this is the work of an operations-research or logistics engineer who builds and tunes route-optimisation for a distribution or last-mile delivery fleet."
solution_explanation = "The reference plans come from a slack-induced string-removal search over the dispatch rules: remove short strings of consecutive customers from routes near a random customer, reinsert them at their cheapest feasible positions (a new route of any vehicle kind with spare count being one option), move each route to the cheapest kind that can run it and swap kinds between routes, and accept by simulated annealing. Departure times are the latest start that removes waiting without making any stop late, which keeps route duration inside the shift. Each target is the dearest of three cold-start runs of that search (seeds 2, 3 and 4, 40 minutes each on one core), so two cores reach every target in about 80 minutes; the shipped plans come from longer runs and are cheaper than the targets. The search is shipped as solution/search/sisr.py; solve.sh copies the four plans and runs the checker on each."
verification_explanation = "The verifier reads the four plan files as JSON data and evaluates them with its own copy of the dispatch rules and its own copies of the orders and targets, so nothing the agent edits in /app/tools or /app/orders affects grading and no candidate code runs. For each morning one test checks that the plan is runnable (every customer served exactly once, windows, capacity, shift, range, fleet counts, integer departures) and one checks that its integer cost is at or below the target. Plans are read as strict JSON through the checker's own loader, which rejects repeated keys, NaN and Infinity, and keys the plan format does not define. The reference plans pass all eight tests; the plans from the shipped planner fail (two mornings miss customers, the other two cost 41-49 percent over target)."
relevant_experience = "Operations research on vehicle routing and fleet sizing: building and tuning large-neighbourhood and string-removal searches for time-windowed routing with heterogeneous fleets, and validating plans against depot operating rules."

