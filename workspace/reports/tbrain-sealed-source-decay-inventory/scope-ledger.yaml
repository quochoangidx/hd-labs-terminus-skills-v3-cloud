# Bounded scope ledger (bounded-task-design.md), written before scaffold expansion.
slug: tbrain-sealed-source-decay-inventory
primary_outcome: >
  The quarterly survey report of a sealed-source inventory decay-corrected to the survey
  date (per-entry current and daughter activity, exempt / leak-test-due / decay-to-disposal
  calls, per-location held activity, source count and fraction of limit) agrees with
  manual RPO-7 over the whole section 1 envelope.
causal_core: >
  Day count -> elapsed time -> decay-corrected current activity -> (daughter, total) ->
  threshold calls; wipes -> leak tests (1.7) -> leak-test due; certificate -> licensed
  material (1.8) + current activity -> what a location holds. Redesigned after
  contract_review r1: the "in storage" exclusion was removed.
core_obligations:
  - {id: DAY_COUNT, contribution: "actual Gregorian days (1.2)", authority: "manual 1.2", witness: "month-end / 29 Feb reference and survey dates", plausible_wrong: "keep thirty-day months"}
  - {id: HALF_LIFE_DAYS, contribution: "365.25-day year (1.4)", authority: "manual 1.4", witness: "year-unit nuclides decades old", plausible_wrong: "365-day year"}
  - {id: DECAY_LAW, contribution: "A_ref 2^(-t/T) (3.1)", authority: "manual 3.1", witness: "any aged entry", plausible_wrong: "exp(-t/T), half-life used as mean life"}
  - {id: DAUGHTER, contribution: "branching fraction (3.2)", authority: "manual 3.2", witness: "Cs-137 entries (0.944)", plausible_wrong: "daughter equal to parent"}
  - {id: EXEMPTION, contribution: "total activity at or below exempt quantity (4.1)", authority: "manual 3.3/4.1", witness: "Sr-90 at 5000 Bq on its reference date (total exactly 1e4)", plausible_wrong: "parent alone compared"}
  - {id: LEAK_TEST, contribution: "current activity vs class threshold; latest-dated leak test more than 182 days back (5.1/5.2)", authority: "manual 5.1/5.2", witness: "certificate above / current below threshold; exact thresholds on the reference date; wipes out of date order, 182 and 183 days", plausible_wrong: "certificate figure; last wipe listed"}
  - {id: DISPOSAL, contribution: "short-lived and t >= 10 T (1.6/7.1)", authority: "manual 7.1", witness: "Ir-192 / I-125 aged between 9.966 and 10 half-lives", plausible_wrong: "activity at or below a thousandth of the certificate figure"}
  - {id: LOCATION_POSTING, contribution: "held activity and count of licensed material from current activities; fraction; over limit (6.1/6.2)", authority: "manual 6.1/6.2", witness: "stores of aged licensed entries with daughters; a store held exactly at its limit on the reference date; an empty store", plausible_wrong: "sum certificate figures; add daughter activity"}
  - {id: TRAP_WIPE_NOT_A_LEAK_TEST, contribution: "a wipe of 185 Bq or more is not a leak test (1.7), so it is neither the last leak test nor one on record", authority: "manual 5.2 -> 1.7", witness: "own named test", plausible_wrong: "latest wipe by date whatever it read"}
  - {id: TRAP_LICENSING_FOLLOWS_CERTIFICATE, contribution: "licensing judged on the certificate parent figure (1.8), kept from the shipped filter while D9 is rebuilt", authority: "manual 6.1 -> 1.8", witness: "own named test", plausible_wrong: "licensing on today's activity, the exempt flag, or no filter"}
  - {id: TRAP_FUTURE_CERTIFICATE, contribution: "certificate dated after the survey keeps today's step (no elapsed time, certificate figure stands); not named in the instruction", authority: "manual 1.3 + value-level silence clause", witness: "own named test, shipped differential + model", plausible_wrong: "signed calendar day count back-extrapolates (or overflows)"}
support_obligations:
  - {id: DRIVER_AND_LAYOUT, supplied_boundary: "tools/sealsrc_run.py, JSON input and report layout (README)", why_not_core: "fixed plumbing, verifier runs its own copy of the driver"}
  - {id: NUCLIDE_TABLE, supplied_boundary: "Table 2 values transcribed in nuclides.py", why_not_core: "the shipped table already matches the manual"}
non_goals:
  - nuclides outside Table 2; figures or dates outside the section 1 limits
  - entries naming unlisted locations; repeated ids; malformed files
  - direct calls of package helpers (graded only through the driver)
  - daughter in-growth before equilibrium; transient equilibrium; rounding or display formats
