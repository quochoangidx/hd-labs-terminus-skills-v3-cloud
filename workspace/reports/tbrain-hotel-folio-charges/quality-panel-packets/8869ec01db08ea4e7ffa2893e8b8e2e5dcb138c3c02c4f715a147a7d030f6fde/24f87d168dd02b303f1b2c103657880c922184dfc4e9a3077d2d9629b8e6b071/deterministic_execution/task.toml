difficulty_explanation = "This is the work of a hotel front-office accounts manager who keeps the checkout folio tooling in line with the hotel's written charging rules. The package carries slips real property-management systems make. It charges every night where the rules give every seventh night free, charges the old 200-cent city tax on every night where the rules charge a room at 5,000 cents or more 250 cents for its first 14 nights only, and takes the occupancy tax at 12 per cent with Python's round where the rules take 13.5 per cent with an exact half cent going up. The harder half is knowing where the rules stop. They give no city tax for a room under 5,000 cents a night and no rate or rounding for the service fee. A cheaper room keeps today's city tax, nothing under 3,000 cents a night and otherwise 200 cents for every night with no limit, and the service fee keeps today's 3.5 per cent rounded by Python's round, a half cent going to the even cent. Both kept steps sit inside code every repair has to touch: the city-tax function has to be rewritten for the new amount and stop, and the rounding helper is the one the occupancy tax used. The natural rewrites drop the cheaper rooms' tax or round the fee half up. A hand-built reference fuzzed against the package will not flag the difference. No real guest data is used. The night audit files are synthetic, shaped like property-management exports, with hand-built files that sit on every limit."
solution_explanation = "The reference patch charges a stay's nightly rate for every night except every seventh, gives a room at 5,000 cents a night or more a city tax of 250 cents for each of its first 14 nights, and takes the occupancy tax at 13.5 per cent of the room charge with an exact half cent going up, through its own rounding step. Where the rules give no rule it keeps today's step: a room under 5,000 cents a night keeps nothing under 3,000 cents and otherwise 200 cents for every night, and the service fee keeps 3.5 per cent of the rule 2.1 room charge rounded by the untouched money.to_cents(), Python's round. All arithmetic is exact. The driver is untouched."
verification_explanation = "A separate verifier image records the delivered driver's bytes, puts its own copy on /app/tools/folio_run.py, seals /app as root-owned, and runs the documented command against the delivered /app/src. Each run is made as an unprivileged user in its own session with an isolated interpreter, on each file staged under one neutral name. It compares every README key as a JSON integer or string, and the folio order. Expected folios were sealed ahead of time into tests/expected by solution/seal.py from solution/model.py, a model written from the rules that never imports the package, and are pinned by SHA-256 and row count in tests/expected/ROSTER. There are 10 tests over 8 sealed files: one named test for each of rules 2.1, 2.2, 2.3 and 2.5, one for each of the two figures left to today's code, a limits test, a seeded family and two harness tests. Rooms under 5,000 cents a night appear only in the test that grades their city tax. A stay whose service fee lands exactly on a half cent is graded on that fee, and on the totals that include it, only in the service-fee test. Named files put stays at 1, 6, 7, 8, 13, 14, 15 and 60 nights, rates at 1,000, 2,999, 3,000, 4,999, 5,000 and 150,000 cents, and room charges whose occupancy tax and service fee land exactly on a half cent with an even and an odd lower cent. Every rule 1.2 limit is reached: 200 stays, 1 and 60 nights, rates of 1,000 and 150,000 cents, and ids of 1 and 10 characters. The seeded family is also billed under run-time labels drawn from os.urandom: new ids and a new name, with stays shuffled. Locally the Oracle scores 1 and the unfixed package 0. Fourteen one-edit mutants of the reference each fail their own test, among them every departure reverted, every eighth night free, a 13-night stop, the occupancy tax rounded half to even, the service fee rounded half up, the new city tax or a 14-night stop applied to cheaper rooms, the 3,000-cent exemption dropped, a 5,001-cent threshold and a 199-stay cap. A contract-valid alternative scores 1, and a test proves the candidate cannot read /tests, the expectations, the shipped copy or /logs/verifier."
relevant_experience = "Hotel front-office and night-audit accounting: room and package charging, occupancy and city taxes, service charges and their rounding, and the property-management systems that post them to guest folios."

