difficulty_explanation = "This is the work of an industrial hygienist or hearing-conservation coordinator who keeps a programme's noise-survey tool honest against its written manual. The package still carries the federal occupational-noise habits it was written for. It uses a 90 dBA criterion with a 5 dB exchange rate, and a TWA of 90 + 16.61 log10(D/100) where the programme uses 85 dBA, 3 dB and 85 + 3 log2(D/100). It drops a reading sitting exactly on the 80 dBA threshold. Its sampled time counts only the minutes loud enough to add dose, so quiet worn time vanishes from the projection denominator. It projects partial surveys to eight hours rather than to the worker's own ten- or twelve-hour shift, truncates the reported TWA, uses the federal 85/90 status bands, misses a 140.0 dBC peak as an impulse, and judges a similar-exposure group by averaging its members' decibels, which understates a group with a few loud members. Each is a slip a hygienist has seen in real survey software. The harder half is knowing where the manual stops. Its projection rule speaks of a partial survey, which 2.5 defines as one that sampled at least three quarters of the shift, and its dose rule counts a reading at its own level only up to the 115 dBA ceiling level defined in section 5. The natural repairs apply the rule everywhere. One projects every survey shorter than the shift to the shift, or leaves a short survey unprojected. The other writes the 3.1 formula with the logged level and drops the min(level, CEILING_DBA) step inside the loop that the sampled-time repair forces the solver to rebuild. The manual gives no rule for those figures, so the step the code takes today has to stay while everything around it is repaired, and a hand-built reference fuzzed against the package will not flag the difference. A reading logged at 0.0 dBA is not a reading, so it must stay out of the rebuilt sampled time, and a quiet worker's dose of nought still counts in the group mean. No real survey data is used. The surveys are synthetic and shaped like dosimeter time-history exports: runs of whole minutes at levels of one decimal, shifts from one hour to a full day, peak-hold lists, and hand-built surveys that sit exactly on each limit."
solution_explanation = "The reference patch sets the programme's 85 dBA criterion and 3 dB exchange rate, counts a reading at the 80.0 dBA threshold, and makes sampled time the length of every reading of 40.0 dBA or more, so runs at 0.0 stay out. It projects a partial survey (at least three quarters of the shift and shorter than it) to the worker's own shift, and lets a survey of the whole shift or longer keep its measured dose. It reports the TWA as 85 + 3 log2(D/100) rounded to the nearest tenth, puts the status bands at 82.0 and above 85.0 with a flagged worker always over, counts a 140.0 dBC peak as an impulse, and takes a group's dose as the plain mean of every member's shift dose, with its TWA and status following from that dose. Where the manual gives no rule it keeps today's step: a survey below three quarters of its shift keeps the old scaling to 480 minutes (nought when nothing was sampled), worked from the manual's sampled time and measured dose, and a reading above the 115 dBA ceiling level is still counted at the ceiling level. The driver is untouched."
verification_explanation = "A separate verifier image records the delivered driver's bytes, puts its own copy on /app/tools/noisedose_run.py, and runs the documented command against the delivered /app/src. It runs as an unprivileged user in its own session with an isolated interpreter, on each survey staged under the same neutral name in a fresh directory, and compares every key the README lists (a group row may carry no ceiling or impulse flag, per 6.1; other further keys are ignored). id, group, status, ceiling, impulse, the survey name and both list orders are compared exactly, and so is twa, which must equal the expected tenth or be null. dose must be the unrounded figure: the instruction states an accept bound of one part in 10^11 (10^-11 below one) and a reject bound of one part in 10^10, and the verifier grades at the midpoint, 5e-11; the sealed doses keep twelve significant figures, at most 5e-12 from the model, so a dose rounded to six or nine decimals fails while a different summation order passes. Expected reports were sealed ahead of time into tests/expected by solution/seal.py from solution/model.py, a model written from the manual that never imports the package, and are pinned by SHA-256 and row count. There are 23 tests over 21 sealed families (39 surveys, 444 workers): one named test per manual rule, and one for each kind of figure the manual leaves to today's code. The families include readings at 79.9, 80.0 and 80.1 dBA, 40.0 dBA readings, runs at 0.0, surveys one minute short of, exactly at and past three quarters and the whole shift, TWAs landing on 82.0 and 85.0 once rounded, quiet group members, group codes of one to eight characters with digits before letters, the section 1 limits (300 workers, 40 codes, a 1,500-run log, a 2,880-minute log, 500 peaks whose only impulse is the last), an impulse that follows a hundred quieter peaks, groups whose ceiling- or impulse-flagged member leaves the group's own TWA at action or below, and five seeded surveys drawn only from inputs the manual governs. One test reduces doses above a full shift at the ceiling level, built as whole multiples of the sealed 480 minutes at 115.0 dBA (dose is linear in reading minutes): 4x with its TWA exactly 6 dB higher, 3x through a partial projection, and 6x, the largest dose section 1 allows (2,880 minutes at 115.0 dBA). The seeded surveys are also reduced under labels drawn at run time from os.urandom (a new survey name that is empty, 111 or about 1,930 characters long, non-ASCII, or padded with spaces, new worker ids, shuffled workers, each run split in two at its level); the relabelling leaves every figure unchanged, the expected report follows the same labels, and the draw is printed with any failure, so a report cannot be looked up by survey name or content. Surveys below three quarters of the shift (including ones whose sampled time differs from their counted minutes), surveys that measured nothing and readings above the ceiling each sit in their own test. Each of those tests also runs a copy of the shipped package, owned by its own user and closed to the candidate, on 11 survey pairs as a differential. Every graded survey is checked against the section 1 limits and the inputs its family declares. The driver is byte-checked before and after candidate code, all of /app is made root-owned and closed to writes by others before any candidate code runs, and a test proves the candidate cannot read /tests, the expectations, the shipped copy or /logs/verifier. Locally the Oracle scores 1 and the unfixed package 0. Twenty-one wrong submissions each fail their own test: every departure reverted, both natural over-repairs of the short-survey step, today's step worked from counted-only minutes, counting above-ceiling readings at their own level, counting 0.0 runs as sampled time, a tampered driver, a package reading the expectations, and the unfixed package returning stored reports keyed by survey name. So do 53 one-edit mutants of the reference (among them a shift dose capped at 102,400, 204,800 or 500,000 per cent, a survey name capped, truncated, stripped or made ASCII, impulse read from the first 100 or all but the last peak, a group inheriting a member's ceiling, impulse or over status, flags on group rows, doses rounded to six or nine decimals or biased by 2e-10, and a TWA off its tenth by 1e-12), while six contract-valid alternatives (built-in round, Decimal half-up, fsum with a different key order, extra worker and report keys, a dose biased by 5e-12, and an integral TWA written as an integer) score 1."
relevant_experience = "Industrial hygiene practice in a manufacturing hearing-conservation programme: planning and reducing personal noise-dosimetry surveys, criterion, exchange rate and threshold settings, projecting partial surveys, similar-exposure-group assessment, and maintaining the software behind the regulatory compliance reports a programme files."

