primary_outcome: the incident report triage.py writes equals the report case-guide.md gives for any evidence directory collected the documented way
causal_core: one corrected UTC timeline (offset, year back-inference, clock step) joined with login attribution (btmp hostility, wtmp sessions, key fingerprints from attacker histories, TTY-owned sudo) to a fixed point, then windows that select persistence by ctime and bound activity
core_obligations:
  - {id: TIMELINE, contribution: rules 1-3, authority: case-guide 1-3, witness: year rollover / clock step / offsets families, plausible_wrong: collection year for all lines; ignore step; step on auth.log only; local as UTC}
  - {id: INITIAL_ACCESS, contribution: rules 4-6, authority: case-guide 4-6, witness: brute + rotation families, plausible_wrong: first successful login; any five failures; strict < 600; auth.log failures}
  - {id: ATTRIBUTION, contribution: rules 7-8, authority: case-guide 7-8, witness: key family, plausible_wrong: keys from every history; ignore key login from second address}
  - {id: ESCALATION, contribution: rules 9-10, authority: case-guide 9-10, witness: sudo family, plausible_wrong: first sudo by the compromised account after initial access}
  - {id: PERSISTENCE, contribution: rule 11, authority: case-guide 11, witness: ctime family, plausible_wrong: mtime; no package exception; any file with ctime in window}
  - {id: ACTIVITY, contribution: rule 12, authority: case-guide 12, witness: open family, plausible_wrong: first = initial access; last = last logout}
support_obligations:
  - {id: PARSING, supplied_boundary: formats fully specified in record-formats.md (not supplied code), why_not_core: parsing alone decides nothing; graded only through the report}
  - {id: CLI_JSON, supplied_boundary: stub triage.py already parses argv and writes JSON, why_not_core: plumbing}
non_goals: [non-SSH intrusions, multiple attackers, DST zones, malformed or truncated records, su/doas escalation, useradd-created accounts, IPv6 formatting, performance beyond a few thousand lines]
removed_obligations:
  - {id: BACKWARD_STEP, rescope: E2 (2026-09-28, orchestrator batch authority), former_anchor: "case-guide rule 1: may have been wrong by a fixed amount", now: "may have run behind by a fixed amount ... set forward, at most once", why_not_core: overlap handling (month-end year walk, collector-settled logins in the overlap, rotation) is breadth, not the causal core; the forward step keeps the inferred-clock obligation}
  - {id: ROTATION_STEP_ANCHOR, kind: guarantee added, text: "the auth logs always keep at least one line from before the step that the collector also holds", enforced_by: model.within_limits}
