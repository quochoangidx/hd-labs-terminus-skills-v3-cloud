difficulty_explanation = "This is the work of a Linux incident responder doing host forensics on an SSH intrusion: turning a collected evidence directory into the incident report a response team files. No single log answers any field. The host clock ran slow or fast until it was set right, and nothing on the host records the step. The only trustworthy clock is the team's remote log collector, which kept a copy of the sshd lines, so the responder has to match those lines against the local auth logs to find the error and the moment it ended. The same correction then has to be applied to every other host-clock source: wtmp and btmp seconds, timestamped shell history, file ctimes and the package manager's log. Syslog lines carry no year and the evidence may cross into January. Rotation has deleted the oldest auth-log lines, so the brute force that marks the intruder's address survives only in btmp. Attribution runs through chains of evidence rather than one field. The intruder's first login uses a password shared with the account's regular user. A key the intruder writes into authorized_keys from that account's shell has to be recognised by computing its OpenSSH fingerprint, which then ties a later key login from a new address, sometimes as root. A sudo line names an account, not a person: only the terminal it ran on, matched to the wtmp session open on that terminal, separates the intruder's escalation from the regular user's sudo in a concurrent session. Persistence must be read from ctime, because the intruder backdated mtimes with touch -r, while a package the unattended upgrader installed during the intrusion wrote a cron file whose ctime also falls inside the session. The last activity may be a timestamped root command in a session that never logged out. Each of these has a natural reading that gives a wrong report, and the case guide defines the findings without spelling out the procedure, so the responder must reconstruct it from the evidence. Evidence sets are synthetic: generated hosts collected the documented way, with scanners, mistyping users, administrators working during the intrusion, and every stated range at both ends."
solution_explanation = "The reference, solution/triage.py (about 270 lines, standard library only), follows the case guide's order. It reads the collection offset and the collection time, then reads the auth logs oldest rotation first and assigns each line a year walking back from the collection time. It matches every sshd line with its copy in the remote collector's log; the difference between the two gives the host-clock error (either sign), and the first line that agrees again marks the step: auth-log lines before it in file order, and any other host-clock reading below its host time, are corrected by the error. wtmp gives sessions (login to the logout on the same line, or still open at collection) and btmp gives every failed attempt. A hostile address has five failures within 600 seconds, and the earliest login from one is the initial access. From there it iterates to a fixed point. Addresses of intruder logins give sessions. Keys that a command in an intruder account's history writes into an authorized_keys file are fingerprinted, and a login with one of those fingerprints adds its address. A sudo line to root belongs to the session open on its terminal, and an intruder sudo or root login adds root, whose history can add keys. Persistence is every listed path of the stated kinds whose ctime lies in an intruder session, minus files a package lists that were written within 2 seconds of that package's status installed line. First and last activity are the minimum and maximum over failures from intruder addresses, intruder logins and logouts, intruder sudo lines, timestamped history of intruder accounts inside intruder sessions, and persistence ctimes. solve.sh copies it to /app/triage.py."
verification_explanation = "A separate verifier image receives only the delivered /app/triage.py. Before any candidate code runs it rebuilds /app from that file and the task docs, root-owned and read-only. Every graded evidence set and its expected report were generated at authoring time by solution/seal.py from solution/model.py. The model draws a scenario (legitimate background use of the host, one intruder, the decoys) and renders it the way the host would have recorded it. The expected report comes from the scenario's own intruder-labelled objects, never from parsing the evidence, so the reference agreeing with it is two independent derivations agreeing. The verifier holds no model or generator. It checks every sealed file against tests/expected/ROSTER, stages each case under the neutral name evidence in a fresh prefix-less temporary directory, root-owned and read-only, and runs python3 /app/triage.py <evidence> <out.json> as uid 65534 under setpriv --no-new-privs with python3 -I -S, an empty environment and its own session, with no network. Each report must have exactly the seven keys: the three list fields compared as sets of strings without duplicates, and everything else type-strictly and exactly. There are 30 cases in 15 named tests: the visible case-1, and one test each for the host-clock correction (clocks that ran slow and clocks that ran fast), the new-year rollover, the local offsets, the 600-second hostile window (exactly 600 inclusive, and a mistyping user at 601), failures only in btmp after rotation, a planted key tying a second address, escalation on the intruder's terminal while the regular user runs sudo, escalation by a root login with no sudo, ctime over forged mtime together with a package install inside the session, an open last session whose last event is a stamped root command, three range-end sets (offsets -12:00 and +14:00, steps of 30 and 7,200 s in both directions, years 2019 and 2031, one and six auth-log files, package writes 2 seconds either side of the install line), and broad hosts. A final test proves the candidate uid cannot read /tests or /logs/verifier. Locally the Oracle scores 1 three times and the empty stub 0. Fifteen natural wrong analyzers each fail their own test: no year rollover, host clock trusted, correction applied to the auth log only, correction added to every reading, the root-login escalation dropped, local time taken as UTC, a strict 600-second window, any five failures, failures counted from the auth log, first successful login taken as initial access, keys from every history, escalation by account instead of terminal, mtime trusted, the package exception dropped, and a candidate that reads the expectations. Twelve one-edit mutants of the reference also fail their own tests: package tolerance strict or zero, years capped at 2030, offsets clamped at +12:00 or -11:00, steps capped at 3,600 s, only five auth-log files read, an open session's collection time counted, pre-attack failures dropped, root history ignored, and a blind solver's analyzer that corrects by a session's start side of the step. Three contract-valid alternatives score 1: lists in another order, one host-time split at the step for every host-clock reading, and an independently written analyzer."
relevant_experience = "Linux incident response and host forensics: reading syslog auth logs, utmp/wtmp/btmp records, shell histories, authorized_keys and OpenSSH fingerprints, dpkg state and file-system timelines, correlating them across a host clock error and time zones, attributing SSH logins and sudo to sessions, and writing triage tooling for a response team."

