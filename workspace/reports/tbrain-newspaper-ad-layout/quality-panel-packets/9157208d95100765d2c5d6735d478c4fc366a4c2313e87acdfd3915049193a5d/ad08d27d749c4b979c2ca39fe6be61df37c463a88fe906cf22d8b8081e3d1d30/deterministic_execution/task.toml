[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "advanced"
category = "Media"
subcategory = "Design"
languages = ["python"]
tags = ["ad-layout", "rectangle-packing", "knapsack", "metaheuristics", "newspaper-production"]
expert_time_estimate_hours = 6
difficulty_explanation = "Each edition is a newspaper ad make-up problem: 58-138 ads of different column widths and depths go onto 16-32 pages of a six-column, 42-row grid. An ad must rest on the foot of the page or on ads across its whole width, a page carries at most 60 percent ads and the front page only a bottom strip, and two ads of one competitor group may not share a page or a spread. Booked ads must run; others earn their rate if placed, and section and right-hand-page requests cost a share of the rate when missed. It is a two-dimensional packing problem with stacking, capacity and spread-level exclusion rules coupled to a revenue knapsack: which ads to leave out depends on which shapes pack together on which pages. A make-up editor has to search over page assignments and packings together; the shipped first-fit planner costs 28-54 percent over target, and the targets come from hours of large-neighbourhood search, so a greedy or short search stops above them. The editions are synthetic but modelled on a regional daily's sections and rate card."
solution_explanation = "The reference layouts come from a large-neighbourhood search: clear one to four pages (random pages, one spread, or pages of one section), take the cleared ads plus a sample of left-out ads in a randomized order, and put each at its cheapest spot on the cleared pages, on the lowest flat stretch of the columns' filled heights, which is exact because an ad must rest across its whole width. Steps are accepted by simulated annealing. Runs started from the shipped planner, then from the cheapest layout so far: 40-minute seeds, iterated shorter searches at varied temperatures, and single searches of two and four hours. Each target is the cost of the cheapest layout seen. solve.sh copies the four layouts and runs the checker on each."
verification_explanation = "The verifier reads the four layout files as JSON data and scores them with its own copy of the checker, editions and targets, so nothing the agent edits under /app affects grading and no candidate code runs. For each edition one test checks that the layout is valid (standard JSON within the stated limits, known ads with whole-number positions, inside the page, no overlap, resting on the foot or on ads, page share and front-page strip, competitor groups apart by spread, every booked ad placed) and one checks that its integer cost is at or below the target. The reference layouts sit exactly on the targets; the shipped planner's layouts cost 7114, 9167, 10544 and 13571 against targets of 4635, 6701, 7500 and 10601."
relevant_experience = "Newspaper production and packing optimisation: ad make-up under page-grid, stacking and competitor-separation rules, and large-neighbourhood search for rectangle packing with revenue trade-offs."

