difficulty_explanation = "This is the work of a rental-billing analyst who keeps a car-hire branch's charging code honest against its written charges manual. The package carries slips real counter systems make. It charges every day begun instead of whole days with 59 minutes free past the last one, and still allows the old 100 miles a day where the manual gives 150. It reads a turned-over odometer as negative miles, leaves out the 1,500-cent refuelling fee, taxes the fuel line, and drops the fraction of a cent the manual rounds half up. The harder half is knowing where the manual stops. Its day rule speaks only of a day rental, 24 hours or more, and its fuel rule only of a refuelling rental, a car back with fewer eighths than it left with. For a rental under a day, the step the code takes today (every day begun, so one day) has to stay. The natural rewrite writes the grace rule for every rental, and that charges a rental of under an hour for no days at all. For a car back with its tank as full or fuller, today's step gives nought or a credit of the fuel rate for each eighth over. The natural repair floors that line at nought, which is a clamp the manual never gives, and a hand-built reference fuzzed against the package will not flag the difference. No real agreements are used. The agreement files are synthetic, shaped like closed-contract exports, with hand-built files that sit on every limit."
solution_explanation = "The reference patch charges a day rental for its whole days of 1,440 minutes and one more day only when more than 59 minutes are left over, and allows 150 miles for each day charged. It adds 1,000,000 miles when the odometer came back reading less than it went out, charges a refuelling rental the fuel rate per eighth short plus the 1,500-cent fee, and taxes only the time and mileage charges at 8.25 per cent, rounded to the nearest cent with a half cent going up. Where the manual gives no rule it keeps today's step. A rental under a day is charged every day begun, which is one day, and its allowance follows from that day by 3.2. A car back with as much fuel or more keeps today's fuel line: the fuel rate times the eighths out less the eighths in, which is nought or a credit, with no fee. All arithmetic is in integer cents, so the tax is exact. The driver is untouched."
verification_explanation = "A separate verifier image records the delivered driver's bytes, puts its own copy on /app/tools/rentcharge_run.py, seals /app as root-owned, and runs the documented command against the delivered /app/src. Each run is made as an unprivileged user in its own session with an isolated interpreter, on each agreement file staged under one neutral name in a fresh directory. It compares every key the README lists as a JSON integer, and the bill order. Expected bill runs were sealed ahead of time into tests/expected by solution/seal.py from solution/model.py, a model written from the manual that never imports the package, and are pinned by SHA-256 and row count in tests/expected/ROSTER. There are 15 tests over 13 sealed files: one named test per rule, one for each of the two figures the manual leaves to today's code, one combining them, a limits test, a seeded family and two harness tests. Rentals under a day and cars back fuller appear only in the tests that grade them. The named files include lengths of whole days, one minute and 59, 60 and 61 minutes past a whole day, 1, 30, 59, 60 and 1,439 minutes, and 60 days. They also include allowances met exactly and passed by a mile, odometers at 999,999 turning over and 20,000 miles driven, fuel from empty to full each way, and taxes of 16.5, 49.5, 115.5 and 1,105.5 cents. Every rule 1.3 limit is reached at both ends: 1 and 200 agreements, the years 2000 and 2099, and each rate and reading at its ends. The seeded family is also billed under labels drawn at run time from os.urandom: new branch and ids, shuffled agreements, and every time moved by whole weeks. The draw is printed with any failure. Locally the Oracle scores 1 and the unfixed package 0. Twenty-two one-edit mutants of the reference each fail their own test, among them every departure reverted, grace at 58 and 60 minutes, turnover at 999,999, the fee per eighth, half-even and floor tax, the grace rule applied under a day, a fuel line floored at nought, and caps at 199 agreements and 30 days. Two contract-valid alternatives score 1, and a test proves the candidate cannot read /tests, the expectations, the shipped copy or /logs/verifier."
relevant_experience = "Rental counter and billing operations for a car and van hire business: agreement close-out, day and grace-period rating, mileage allowances, fuel and refuelling charges, sales tax on rental charges, and the billing software that produces customer invoices."

