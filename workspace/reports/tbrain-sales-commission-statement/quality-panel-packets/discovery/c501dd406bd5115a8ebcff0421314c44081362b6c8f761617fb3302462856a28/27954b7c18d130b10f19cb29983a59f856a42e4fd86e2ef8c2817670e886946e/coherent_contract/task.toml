difficulty_explanation = "This is the work of a sales-compensation analyst in a company's sales finance team who pays field reps' quarterly commission statements against the written compensation plan. The package carries slips a comp desk sees in real incentive tools: it credits a shared deal in full to every rep on it instead of each rep's split, pays the accelerator rate on the whole quarter once bookings pass quota instead of only on the part above it, truncates band commission instead of rounding each band half up, claws back reversals only up to 90 days instead of the plan's 120, drops the new-logo bonus on small splits, recovers an owed draw out of the guaranteed draw itself, and keeps an older 10,000-cent minimum payment. The harder half is judging how far each rule reaches, which is a question of scope, not arithmetic. The clawback rule speaks of a reversal, defined as a credit note of 50,000 cents or more; the plan gives every credit note a clawback line but prices only reversals, so a small courtesy credit keeps the line today's code gives it, 800 basis points of the rep's share within the 90-day window. The bonus rule speaks of a new-logo order, a first order of 250,000 cents or more; every first order carries a bonus line, so a small trial order keeps today's 300-basis-point line above the 10,000-cent floor. Both kept figures sit in a small table the governed rules also read: the natural repairs edit window_days to 120 or small_cents to 25,000 in place and move the kept lines with them, and the opposite over-repair, reading 5.1 and 6.1 as the only clawback and bonus and zeroing courtesy credits and trial orders because a goodwill credit or a trial order feels like it should cost or earn nothing, contradicts rules 5.2 and 6.2. A reference written from the plan and fuzzed against the package makes the same choice as the repair, so self-testing cannot reveal either over-reach. No real payroll data is used: jobs are synthetic CRM order and credit-note exports with quotas, draws and balances, plus hand-built reps on every limit of the plan."
solution_explanation = "The reference patch (solution/fix.patch, table in solve.sh) changes bookings.py, commission.py, clawback.py, bonus.py, payout.py and figures.py. Bookings add the rep's split share of each order (2.2, 3.2). Commission is three marginal bands, 800 basis points to quota, 1,200 to twice quota and 1,600 above, each rounded half up (4.1, 4.2). A reversal, a credit note of 50,000 cents or more, is clawed back up to an age of 120 days through a new reversal_days figure, while window_days stays 90 for other credit notes (5.1). A new-logo order, a first order of 250,000 cents or more, earns its 300 basis points whatever the rep's share, while other first orders keep the 10,000-cent floor (6.1). The owed balance is recovered only from the part of the total above the draw (7.3), and the minimum payment reads a new payment_cents figure of 25,000 while small_cents stays 10,000 for the bonus floor (7.4). statement.py, money.py, dates.py and the driver are unchanged. All arithmetic is in Python integers, so bookings of 3 x 10^11 cents are exact."
verification_explanation = "A separate verifier image records the delivered driver's bytes, os.replace-s its own copy onto /app/tools/commission_run.py, seals /app root-owned, and runs the documented command against the delivered package as an unprivileged user in its own session with python3 -I -S, on each job staged under the same neutral name in a fresh directory. Every output is compared whole and type-strictly: one statements key, statements in job order, exactly the README's ten keys, every figure an int equal to the expected one. Expected statements were sealed into tests/expected by solution/seal.py from solution/model.py, a model written from the plan that never imports the package, and are pinned by SHA-256 and row count in tests/expected/ROSTER; the verifier holds no model and no generator. There is one named test per rule: splits of 1 to 99 per cent with half-cent shares, orders on and next to both quarter edges, bookings inside each band and exactly on the quota and on twice the quota, band remainders on both sides of half a cent, reversals at ages 0 to 365 including exactly 120 and 121, credit notes of exactly 50,000 cents, credit notes the day before and after the quarter, new-logo orders with shares below 10,000 cents and a first order of exactly 250,000 cents at splits of 1 to 3, totals below the draw, exactly on it and a cent either side, totals below nought, recovery larger and smaller than the excess over the draw, dues of 24,999 and 25,000 and an empty rep. The two cases left to today's code sit only in their own tests, each also run against a copy of the shipped package owned by its own user as a differential: credit notes below 50,000 cents at ages 0 to 365, and first orders below 250,000 cents with rep shares below 10,000, from 10,000 to 24,999 and above. The limits test reaches 60 reps, 300 orders, 100 credit notes, quotas of 100,000 and 10^10, draws of 10^7, owed balances of 10^8, carried amounts of 24,999, values and amounts of 100 and 10^9, ages of 0 and 365, the 45-day window ends, 2020-Q1 and 2039-Q4, and bookings of 3 x 10^11 cents; rep codes of 1 and 16 characters, with spaces, quotes, backslashes and non-ASCII, and generated jobs rerun under fresh codes and shuffled lists, so a result cannot be looked up. The driver is byte-checked before and after candidate code, and a test proves the candidate cannot read /tests, the expectations, the shipped copy or /logs/verifier, with a verifier-made readable control. Locally the Oracle scores 1 and the unfixed package 0; every departure reverted alone, the in-place table edit, the exclusion reading and the guard removal for each kept case, a tampered driver and a lookup of the expectations each fail their own test, as do 23 one-edit mutants of the reference (caps on reps, orders, credit notes, values, draws and owed balances, a quota floor, code cut or stripped, strict thresholds, half-down rounding, a floored negative total, sorted reps, float and boolean figures), while two contract-valid alternatives score 1."
relevant_experience = "Sales operations and incentive compensation in a company's sales finance team: commission plans with quotas and accelerators, split crediting, clawbacks on cancelled business, new-logo bonuses, recoverable draws and minimum payments, and the software that produces reps' quarterly commission statements."

