# Bounded scope ledger (bounded-task-design.md), written before any verifier.
primary_outcome: >
  The statements printed by /app/tools/commission_run.py give, for every rep in a job, the bookings,
  commission, new-logo bonus, clawback, total, amount recovered, owed balance, amount paid and amount
  carried, as the Field Sales Compensation Plan issue 6 gives them.
causal_core: >
  orders -> rep's split share (2.2, 1.1) of orders counting toward the quarter (3.1) -> bookings (3.2)
  -> commission in three marginal bands, each rounded (4.1, 4.2); first orders -> bonus lines (6.2):
  a new-logo order (2.4) earns 300 bp of the rep's share with no floor (6.1), a first order that is not
  new-logo keeps today's line (rep share below the shipped 10,000-cent floor pays nothing, else 300 bp),
  whose floor figure is shared with the minimum payment; credit notes raised in the quarter -> clawback
  lines (5.2): a reversal (2.3) at an age (2.5) of 120 days or less claws back 800 bp of the rep's share
  (5.1), a credit note that is not a reversal keeps today's line (800 bp within the shipped 90-day
  window), whose window figure is the one 5.1 changes for reversals -> total (7.1) -> draw guarantee and
  owed balance (7.2) -> recovery only from the part above the draw (7.3) -> paid, or carried when a
  draw-less rep's due is below 25,000 (7.4).
core_obligations:
  - {id: SPLIT_BOOKINGS, contribution: "bookings add the rep's split share of each order counting toward the quarter", authority: "plan 2.2, 3.1, 3.2", witness: "orders with splits of 1 to 99 per cent", plausible_wrong: "the whole order value (shipped)"}
  - {id: MARGINAL_BANDS, contribution: "800 bp to quota, 1,200 bp to twice quota, 1,600 bp above, each band rounded half up", authority: "plan 1.1, 4.1, 4.2", witness: "bookings on the quota, on twice the quota, between and above; band remainders of half a cent or more", plausible_wrong: "the reached band's rate on all bookings, truncated (shipped)"}
  - {id: REVERSAL_CLAWBACK, contribution: "a reversal claws back 800 bp of the rep's share up to an age of 120 days; a credit note that is not a reversal keeps today's line with the 90-day window (silent, kept)", authority: "plan 1.5, 2.3, 2.5, 5.1, 5.2; instruction reach rule", witness: "reversals aged 91-121 days (D4); credit notes below 50,000 cents aged 0-90, 91-120 and above (trap TA)", plausible_wrong: "editing the shared window_days entry to 120 (natural fix of 5.1) / nothing for credit notes that are not reversals / no age limit for them"}
  - {id: NEW_LOGO_BONUS, contribution: "a new-logo order earns 300 bp of the rep's share with no floor; a first order that is not new-logo keeps today's line with the 10,000-cent floor (silent, kept)", authority: "plan 1.4, 2.4, 6.1, 6.2; instruction reach rule", witness: "new-logo orders with rep shares below 10,000 (D5); first orders below 250,000 cents with rep shares below 10,000, 10,000-24,999 and above (trap TB)", plausible_wrong: "editing the shared small_cents entry to 25,000 (natural fix of 7.4) / nothing for first orders that are not new-logo / the floor removed for every first order"}
  - {id: DRAW_RECOVERY, contribution: "draw paid when the total falls short, shortfall owed; recovery only from the part above the draw", authority: "plan 7.1, 7.2, 7.3", witness: "reps with a draw and an owed balance larger than the total's excess over the draw; totals exactly on the draw; totals below nought", plausible_wrong: "recovering from the whole total (shipped)"}
  - {id: MINIMUM_PAYMENT, contribution: "a draw-less rep's due below 25,000 cents is carried, 25,000 or more paid", authority: "plan 7.4", witness: "dues of 10,000 to 24,999, exactly 25,000, below 10,000", plausible_wrong: "10,000 cents (shipped small_cents, shared with the bonus floor)"}
support_obligations:
  - {id: DRIVER, supplied_boundary: "tools/commission_run.py, frozen and byte-checked", why_not_core: "plumbing; the harness runs its own copy"}
  - {id: STATEMENT_LAYOUT, supplied_boundary: "README statement keys and order, already produced by statement.py", why_not_core: "serialization already right"}
  - {id: DATES, supplied_boundary: "dates.py quarter bounds and day arithmetic, already right under 1.2", why_not_core: "already right"}
non_goals:
  - malformed or out-of-range job files, repeated rep codes (left entirely open in the instruction)
  - error messages and exit codes
  - direct calls to package helpers (graded through the driver only)
  - multi-quarter history, territory or product rates, caps, anything the plan does not mention
