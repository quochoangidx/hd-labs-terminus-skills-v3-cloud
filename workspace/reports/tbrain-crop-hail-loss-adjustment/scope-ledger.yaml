# Bounded scope ledger (bounded-task-design.md), written before any verifier.
primary_outcome: >
  The statements printed by /app/tools/hail_run.py give, for every field of every claim in a job, the
  stand loss, defoliation, leaf loss, loss, payable loss, indemnity, replant line and payment, and for
  every claim its total and amount paid, as the Crop-Hail Loss Adjustment Procedure edition 7 gives them.
causal_core: >
  sample plots -> plot stand-loss figures (2.1 hail-thinned threshold, 3.1; a plot that is not
  hail-thinned keeps today's figure with today's 5.0 per cent trace step, whose figure is shared with
  the minimum loss) and leaf-damage figures (3.2) -> field averages over all plots (3.3) -> leaf loss by
  stage chart (4.1, 4.3) -> field loss with leaf loss on the surviving stand (4.2) -> minimum loss 8.0
  (5.1) -> deductible option (5.2: straight 10.0, vanishing capped at the loss) -> indemnity rounded half
  up (1.1, 5.3) -> plus replant line (2.2, 6.1, 6.2; a replanting under 10.0 acres keeps today's line with
  today's 2,500-cent trace step, whose figure is shared with the minimum claim) -> claim total (7.1) ->
  paid at 10,000 cents or more (7.2).
core_obligations:
  - {id: PLOT_AVERAGE, contribution: "stand loss and defoliation averaged over all of a field's plots", authority: "procedure 3.2, 3.3", witness: "fields mixing plots without a figure (no plant lost, no leaf damage) with damaged ones", plausible_wrong: "divide by the plots with a figure above nought (shipped)"}
  - {id: PLOT_STAND, contribution: "a hail-thinned plot's stand loss is dead over stand; a plot that is not hail-thinned keeps today's figure with the 5.0 per cent trace step (silent, kept)", authority: "procedure 1.4, 2.1, 3.1, 3.2; instruction reach rule", witness: "plots with 1 plant in 11 to 1 in 200 lost, figures below 5.0, 5.0-7.9 and 8.0-9.9 per cent (trap TA)", plausible_wrong: "editing the shared trace_tenths entry to 80 (natural fix of 5.1) / nought for such plots / the plain share with no trace step"}
  - {id: LEAF_CHART, contribution: "leaf loss is the stage's chart percentage of defoliation", authority: "procedure 4.1, 4.3", witness: "R4 fields with defoliation", plausible_wrong: "R4 at 55 per cent (shipped)"}
  - {id: SURVIVING_STAND, contribution: "loss = stand loss + leaf loss as a share of what the stand loss leaves", authority: "procedure 4.2", witness: "fields with both stand and leaf loss", plausible_wrong: "stand loss + leaf loss (shipped)"}
  - {id: MINIMUM_LOSS, contribution: "a loss below 8.0 per cent pays nothing", authority: "procedure 5.1", witness: "losses of 5.0 to 7.9 per cent", plausible_wrong: "5.0 per cent (shipped, shared entry)"}
  - {id: DEDUCTIBLE, contribution: "straight 10.0 per cent; vanishing twice the excess over 20.0, never more than the loss", authority: "procedure 5.2", witness: "straight fields above 5.0 per cent; vanishing fields above 40.0 per cent", plausible_wrong: "straight 5.0 (shipped); vanishing uncapped (shipped)"}
  - {id: INDEMNITY, contribution: "payable share of liability rounded to the cent half up", authority: "procedure 1.1, 2.3, 5.3", witness: "odd amounts per acre and acres leaving every remainder", plausible_wrong: "truncation (shipped)"}
  - {id: REPLANT, contribution: "a replanted field (10.0 acres or more) earns 3,000 cents an acre; a smaller replanting keeps today's line with the 2,500-cent trace step (silent, kept)", authority: "procedure 1.5, 2.2, 6.1, 6.2; instruction reach rule", witness: "replantings of 0.1 to 9.9 acres, most priced 2,700-9,900 cents (trap TB)", plausible_wrong: "editing the shared small_cents entry to 10,000 (natural fix of 7.2) / nothing for such replantings / no trace step"}
  - {id: CLAIM_MINIMUM, contribution: "claim total; paid in full at 10,000 cents or more, else nothing", authority: "procedure 7.1, 7.2", witness: "claim totals of 2,500 to 9,999 cents and exactly 10,000", plausible_wrong: "2,500 cents (shipped, shared entry)"}
support_obligations:
  - {id: DRIVER, supplied_boundary: "tools/hail_run.py, frozen and byte-checked", why_not_core: "plumbing; the harness runs its own copy"}
  - {id: STATEMENT_LAYOUT, supplied_boundary: "README statement keys and order, already produced by claim.py", why_not_core: "serialization already right"}
  - {id: SHEET, supplied_boundary: "sheet.py reading of claims, fields and plots", why_not_core: "already right"}
non_goals:
  - malformed or out-of-range job files, unknown stages or deductible options (left entirely open in the instruction)
  - error messages and exit codes
  - direct calls to package helpers (graded through the driver only)
  - other crops, other perils, prior-loss coverage reduction, late planting, anything the procedure does not mention
