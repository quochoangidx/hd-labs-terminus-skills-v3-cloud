difficulty_explanation = "This is the work of a workers' compensation claims adjuster or indemnity analyst who keeps a claims unit's temporary disability statements honest against its benefits manual: insurance claims and benefit adjudication for wage-replacement indemnity, not medical cost sharing. The package carries slips an adjuster has seen in real indemnity systems. It credits every payroll line to the week it was paid in, although the payroll pays a week in arrears, so the base period picks up the wrong thirteen weeks. It divides the base-period wages by the weeks that happened to be paid instead of by thirteen, pays 60 per cent of the average weekly wage where this state pays two thirds, caps an old injury at the newest row of the rate table instead of the row in force on the date of injury, lifts a worker whose wage is below the statutory minimum to that minimum instead of paying the wage itself, drops the last day of every certified period, uses a seven-day waiting period where the statute says three, and truncates the total-disability amount instead of rounding it to the cent. The harder half is judging where each rule stops, which is scope, not arithmetic. The arrears rule speaks of a week's pay, which the manual defines as a wage line of 2,000 cents or more; the small corrections the payroll pays beside the weekly wages (a few cents of back pay, a rounding adjustment) are not a week's pay, nothing places them, so they keep counting toward their payday's week. The natural repair rewrites the crediting loop as week_ending(day) - WEEK for every line and moves corrections on the payday of the week of injury into the base period and those on the first base week's payday out of it. Likewise the two-thirds rule for partial disability speaks of a week of partial disability, defined as a week in which the worker earned 1,000 cents or more; a week with no lighter work to give (nothing, or a few dollars of holiday pay) is not one, so it keeps the 60 per cent the package pays today. The natural repair edits the shared RATE_FRACTION constant in rates.py to (2, 3), which partial.py also reads, and silently moves those weeks to two thirds; keeping them needs a separate share. A reference written from the manual and fuzzed against the package makes the same two choices as the repair, so self-testing does not reveal either over-reach. No real claim data is used: jobs are synthetic claim files shaped like a payroll register export, doctors' certified periods, weekly light-duty earnings reports and a statutory rate table, plus hand-built claims on every limit of the manual."
solution_explanation = "The reference patch (solution/fix.patch, table in solve.sh) changes payroll.py, rates.py, partial.py and disability.py. In payroll.py a wage line of 2,000 cents or more, a week's pay, now counts toward the payroll week before its payday's week, the week it pays for; a smaller line keeps counting toward its payday's week, and the average weekly wage is the base-period wages over thirteen. In rates.py the rate fraction becomes two thirds, the maximum and minimum come from the row in force on the date of injury, and an average weekly wage below that minimum is itself the rate. Because RATE_FRACTION is shared, partial.py keeps the previous share of three fifths in its own constant for a week of the partial earnings below 1,000 cents, which the manual does not rule, while a week of partial disability takes two thirds of its wage loss, still capped at the rate. In disability.py both ends of a period count, the waiting period is three days and the total-disability amount is rate times paid days over seven rounded half up in integers; with divisors of 13, 3, 5 and 7 no amount lands on an exact half cent. The base period, the retroactive rule, the statement layout and the driver are unchanged."
verification_explanation = "A separate verifier image records the delivered driver's bytes, os.replace-s its own copy onto /app/tools/tdbenefit_run.py, seals /app root-owned, and runs the documented command against the delivered package as an unprivileged user in its own session with python3 -I -S, on each job staged under the same neutral name in a fresh directory. Every output is compared whole and type-strictly: one statements key, statements in job order, exactly the README's ten keys, every figure an int equal to the expected one. Expected statements were sealed into tests/expected by solution/seal.py from solution/model.py, a model written from the manual that never imports the package, and are pinned by SHA-256 and row count in tests/expected/ROSTER. The verifier also carries tests/manual_model.py, a byte copy of that model, to grade jobs it draws at run time. There is one named test per rule: the arrears crediting on injuries on every weekday, a line of exactly 2,000 cents on the edge paydays, the base period, thirteen as divisor for workers paid in 1 to 13 weeks and for none, two thirds, the maximum and minimum at, above and below their edges, the row in force the day before, on and after a change, an average weekly wage one cent below and at the minimum, one-day, 399-day and twelve-period claims, one to four and thirteen disability days, the retroactive rule at 13, 14 and 15 days, every remainder of the total-disability division, the partial cap, a week of exactly 1,000 cents and weeks earning the average weekly wage or more. The two cases left to today's code sit only in their own tests: corrections below a week's pay on the payday of the week of injury and of the first base week, and partial weeks earning 0 to 999 cents, including weeks where the rate is held at the row maximum and 60 per cent of the loss exceeds it, and weeks whose three fifths of the loss ends in three or four fifths of a cent, so today's cap and its rounding to the nearest cent both decide the figure. Each of those tests also runs a copy of the shipped package, owned by its own user and closed to the candidate, as a differential: job pairs for the corrections, and for the low weeks single jobs whose average weekly wage and rate today's code and the manual agree on, so the shipped partial amount is the answer. Every graded job is checked against the section 1 limits and the inputs its family declares. Every graded claim pays at most one line of a week's wages on a payday, as manual 1.4 describes. The limits test reaches 40 rate rows, 200 claims, 120 wage lines (thirteen weeks' wages and corrections), twelve periods of 400 days, 104 partial weeks, 1 and 500,000 cents and dates in 2016 and 2035, and the generated jobs are also run under fresh claim numbers, shuffled claims and shuffled wage lines drawn at run time, so a statement cannot be looked up by claim number. Four further jobs are drawn afresh on every run from an os.urandom seed printed with any failure: 1 to 40 rate rows with fresh dates and figures, 20 to 60 claims injured on any weekday, registers from empty to every Friday of the 431-day window (the first claim of each job always has more than 52 distinct paydays), corrections away from the base period's edges, 1 to 12 periods and partial weeks of 1,000 to 500,000 cents, all inside section 1 and free of both cases left to today's code, and each is graded against the verifier's model, so no sealed statement can stand in for the calculation. Another test works by hand a register of 53 and one of 57 distinct Friday paydays of 2,000 cents (average weekly wages 1,846 and 2,000). A further test works four claims by hand whose rate one row figure decides: the fortieth of 40 daily rows in force with a 20,000 maximum, a 20,000 maximum holding an unbounded 20,001, a 1,000 minimum lifting 800, and a 100,001 minimum lifting 66,667 for an average weekly wage of exactly 100,001. The driver is byte-checked before and after candidate code, and a test proves the candidate cannot read /tests, the expectations, the shipped copy or /logs/verifier. Locally the Oracle scores 1 and the unfixed package 0. Eighteen wrong submissions each fail their own test: every departure reverted on its own, the natural over-repairs of each case left to today's code (every line shifted a week, corrections dropped; one fraction for every partial week, nothing for a low week, a low week's 60 per cent left uncapped, a low week's 60 per cent floored instead of rounded), a tampered driver, the unfixed package reading the expectations, the reference refusing a register of more than 52 paydays, and a lookup table of every sealed claim that answers anything else with noughts. So do 30 one-edit mutants of the reference (among them a row lookup over only the first 39 rows, a maximum floored at 30,000, a minimum capped at 100,000 or floored at 1,500, a low week uncapped or floored, lines capped at 100,000 cents, the first 100 lines, 128 claims, 32 rows, 100 partial weeks or ten periods, claim numbers cut to 16 characters, stripped or forced to ASCII, strict comparisons at 2,000 and 1,000 cents and at fourteen days, floored rates and partial benefits, one line per payday, statements sorted, a total written as a float), while three contract-valid alternatives (float rounding of the total-disability amount, Fraction rounding of the rate, keys in another order) score 1."
relevant_experience = "Workers' compensation insurance claims and benefit adjudication: computing average weekly wages from payroll registers, statutory maximum and minimum rates by date of injury, waiting periods and retroactive days, temporary total and partial disability indemnity, and maintaining the software behind the benefit statements a claims unit issues."

