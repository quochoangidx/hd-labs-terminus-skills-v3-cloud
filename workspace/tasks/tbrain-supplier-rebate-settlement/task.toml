difficulty_explanation = "This is the work of a distributor's supplier-rebate analyst who settles quarterly supplier rebates and chargebacks against the distribution agreement's rebate schedule: supply chain procurement and supplier terms, not customer billing. The package carries slips a rebate desk sees in real settlement tools. It counts every purchase toward the quarter of its invoice, although freight-shipped cartons arrive four days later and the schedule counts them by receipt; it picks the volume tier on gross purchases instead of net of returns, treats a tier threshold as exclusive, truncates the rebate instead of rounding it half up, pays the growth bonus on all net purchases instead of on the increase over last year, keeps an older handling charge on returns and an older minimum settlement. The harder half is judging where each rule stops, which is scope, not arithmetic. The receipt rule speaks of a carton shipment, defined as a line of 12 units or more; loose units sent by courier are not one, and nothing places them, so they keep the invoice date. The natural repair adds four days to every line in dated_lines and moves loose units at the quarter edges. The handling charge and the minimum settlement live in a small table of contract figures that other uses also read: the cut-off below which a price-match sale is not claimed and the cut-off below which a tidy-up price notice earns nothing. Those sales and notices are not contract sales or price drops as sections 2.4 and 2.5 define them, so they keep today's figures. The natural repair edits the shared unit_handling and small_credit entries in rates.py and silently moves them; keeping them needs a new entry for the governed use. Reading 5.1 and 5.2 as the only credits and paying tidy-ups and price-match sales nothing is the opposite over-repair: rule 5.3 gives every notice and below-cost sale a line. A reference written from the schedule and fuzzed against the package makes the same choices as the repair, so self-testing does not reveal either over-reach. No real supplier data is used: jobs are synthetic ledger exports shaped like invoice lines, supplier return notes, price-change notices and ship-and-debit sales records, plus hand-built accounts on every limit of the schedule."
solution_explanation = "The reference patch (solution/fix.patch, table in solve.sh) changes ledger.py, rates.py, tiers.py, statement.py and growth.py. In ledger.py a line of 12 units or more is dated four days after its invoice; a smaller line keeps its invoice date. In rates.py the return charge and the settlement minimum read two new figures, 40 cents a unit and 25,000 cents, while the shared unit_handling (25) and small_credit (5,000) entries stay as they are for the chargeback and price-notice cut-offs, which the schedule does not set. In tiers.py a tier is reached at or above its threshold and the volume rebate is rounded half up in integers; statement.py picks the tier on net purchases, so net purchases below nought reach none; growth.py takes 200 basis points of the increase over last year. protection.py, chargeback.py, dates.py and the driver are unchanged. All arithmetic is in Python integers, so figures up to 4 x 10^12 cents are exact."
verification_explanation = "A separate verifier image records the delivered driver's bytes, os.replace-s its own copy onto /app/tools/rebate_run.py, seals /app root-owned, and runs the documented command against the delivered package as an unprivileged user in its own session with python3 -I -S, on each job staged under the same neutral name in a fresh directory. Every output is compared whole and type-strictly: one settlements key, settlements in job order, exactly the README's twelve keys, every figure an int equal to the expected one. Expected settlements were sealed into tests/expected by solution/seal.py from solution/model.py, a model written from the schedule that never imports the package, and are pinned by SHA-256 and row count in tests/expected/ROSTER; the verifier holds no model and no generator. There is one named test per rule: carton shipments invoiced in the four days before either quarter edge, a line of exactly 12 units, returns on and next to the quarter edges, heavy returns across a tier, net purchases exactly on a threshold and below nought, every rounding remainder with exact halves, growth of exactly 110 per cent and last year's purchases of nought and one cent, price drops of exactly 250 cents on 100 units, sales exactly 100 cents under cost, settlements of 24,999, 25,000 and 25,001 cents and an empty account. The three cases left to today's code sit only in their own tests, each also run against a copy of the shipped package owned by its own user as a differential: loose-unit lines at the quarter edges, tidy-up notices with credits below 5,000, from 5,000 to 24,999 and above, and price-match sales 1 to 99 cents under cost including 24, 25 and 39. The limits test reaches 12 tier rows, thresholds of 10^11, 100 accounts, 400 lines, 100 returns, 50 notices, 200 sales, every field end, the 45-day window ends, 2020-Q1 and 2039-Q4 and purchases of 2 x 10^12 cents; account codes of 1 and 16 characters, with spaces, quotes, backslashes and non-ASCII, and generated jobs rerun under fresh codes and shuffled lists, so a result cannot be looked up. The driver is byte-checked before and after candidate code, and a test proves the candidate cannot read /tests, the expectations, the shipped copy or /logs/verifier, with a verifier-made readable control. Locally the Oracle scores 1 and the unfixed package 0; every departure reverted alone, the natural over-repairs of each kept case, a tampered driver, a lookup of the expectations and 19 one-edit mutants of the reference (caps on lines, accounts and rows, code cut or stripped or forced to ASCII, strict thresholds, floored bonuses, sorted accounts, a float total) each fail their own test, while two contract-valid alternatives score 1."
relevant_experience = "Distributor and wholesale supply chain operations: supplier agreements and rebate programmes, volume-tier and growth rebates, returns and handling charges, price protection on stock on hand, ship-and-debit chargebacks and the quarterly settlement statements a rebate desk sends suppliers, and the software that produces them."

