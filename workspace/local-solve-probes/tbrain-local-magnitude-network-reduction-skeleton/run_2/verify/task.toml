difficulty_explanation = "Placeholder, frozen before the panel (difficulty not yet measured). This is the work of a network seismologist or bulletin analyst whose local-magnitude package has drifted from the network's own processing manual: the Wood-Anderson record amplitude at the measured magnification 2080 rather than Richter's nominal 2800 and at half the picker's peak-to-peak value, hypocentral rather than epicentral distance, the network's own -log A0 table interpolated linearly in distance, station corrections added, the station value as the mean of its readings rather than the largest channel, and a median network value with a three-station minimum. The harder half is knowing where each rule stops: a reading is an amplitude at least three times its channel's noise, so the new station mean has to leave the others out; a site whose broadband and strong-motion sensors report separately is still one station, so its readings are pooled and it votes once in the median and the three-station count; and the manual gives no correction outside its 10-600 km table, so the log-distance extrapolation the code uses there has to survive the change to linear interpolation. The bulletins are synthetic, drawn to resemble a regional network's picks."
solution_explanation = "Placeholder, to be finalised with the verifier. The patch sets the magnification to 2080 and halves the peak-to-peak amplitude, computes hypocentral distance, interpolates -log A0 linearly in distance between listed distances while keeping the shipped end-segment log-distance calculation outside 10-600 km, adds the station correction, pools a station's readings across its recordings and takes their mean (only amplitudes at least three times their noise), and forms the network magnitude as the median of the contributing stations, each counted once, with null below three. The driver is untouched."
verification_explanation = "Placeholder, to be written with the verifier: the planned verifier runs its own copy of the driver against the delivered /app/mlnet as an unprivileged user and compares whole reports against expectations sealed from a model written from the manual, with one named test per rule and per scope case."
relevant_experience = "Placeholder: regional seismic network operations, routine local-magnitude processing and bulletin review, station-correction calibration."

