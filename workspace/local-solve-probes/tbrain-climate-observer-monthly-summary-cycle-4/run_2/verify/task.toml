difficulty_explanation = "A climate data analyst at a cooperative observer network has to bring a monthly station-summary package back in line with the network handbook, and most of the repair is ordinary climatological practice that was slipped: a morning observer's maximum and gauge catch belong to the calendar day before the form day (so the first reading of the month leaves it and the first reading of the next month closes its last day), a trace is not a hundredth, degree days round each day's mean to the whole degree before the 65 F base instead of rounding the monthly total, the mean temperature of a well-observed month is the average of the mean maximum and mean minimum rather than the mean of daily means, the 90/32/0 F and 0.10/1.00 inch day counts include their own threshold, and a tied extreme is dated on its latest day. The harder half is knowing where each rule stops. The crediting rule moves a day's precipitation, the catch of one observation day; an accumulated amount entered after the gauge went unread is the whole catch since the gauge was last emptied, so the rule does not reach it and it stays where the package credits it today. The natural rewrite of credit_precipitation computes `credited = day - shift` for every amount read at a morning station and moves that amount too. Likewise 4.3 averages a month's standard means, which the handbook defines only for a well-observed month (a gap count of five or fewer), so any other month keeps the package's mean of its daily means; the natural rewrites of monthly_mean apply the new average to every month or return null for gappy months. Each stop follows from a chain of definitions in different sections, and self-testing against a reference written from the handbook cannot confirm it, because the reference carries the solver's own reading of the silent case. The forms are synthetic, generated for this task (no real station data), with realistic seasonal temperature regimes, traces, missing readings and unread-gauge runs."
solution_explanation = "The Oracle (solution/fix.patch) changes five modules of /app/src/coopsum. crediting.py moves a maximum read at a morning observation (hour 0 to 11) and a day's precipitation entered at one to the day before the form day, so `next` feeds the month's last day and form day 1 leaves the month; it tracks unread (`A`) observations so that the accumulated amount that follows keeps its form day. entries.py counts a trace as nought. temperature.py rounds each day's mean to the whole degree before the degree-day base, averages the standard means of a well-observed month (keeping the old mean of daily means otherwise), makes the 90.0/32.0/0.0 counts inclusive and dates tied extremes on the latest day. precipitation.py makes the 0.10/1.00 inch counts inclusive and dates a tied greatest day on the latest day. Everything works in whole tenths and hundredths with an exact half-up division, so every published figure is the exact decimal and no float threshold is ever compared. The driver tools/coopsum_run.py is unchanged."
verification_explanation = "Eighteen named tests, one per handbook rule and one per kept behaviour, each compare whole station summaries (every figure, null and day; counts and degree days must be integers) against expectations sealed by solution/model.py, an independent model of the handbook that never imports the package, stored as readable JSON lines pinned by SHA-256 in tests/expected/ROSTER. Rule witnesses sit on the edges a slip gets wrong: hours 0, 11, 12 and 23; a form-day-1 maximum that leaves the month and a `next` maximum and catch that close its last day; an amount after a lost (M) reading; a gap count of exactly five; means on a half tenth on both sides of nought; daily means of 64.45 and exactly 65.0; maxima of 90.0/32.0, minima of 32.0/0.0 and a tenth either side; 0.09/0.10 and 0.99/1.00 inch days; extremes and wettest days repeated later; months of traces only. The two kept behaviours have their own tests and are the only tests carrying their inputs: accumulated amounts at morning stations (also as `next`, and with a 20.00 reading landing on the same day), checked in full and against a shipped copy of the package on the precipitation figures with every other amount set to 0.00; and months whose gap count is six to all days, checked in full and against the shipped copy on `mean` with every station read in the afternoon. The shipped copy runs under its own uid, mode 0700. A limits test reaches forty stations, a leap February, 1950-01 and 2099-12, -60.0 and 130.0, 20.00-inch amounts, six unread observations and a 620.00-inch month; a generated family is also graded under fresh network names, station ids and station order drawn at run time. Candidate code runs through the verifier's own copy of the driver as an unprivileged user (setpriv --no-new-privs, own session, isolated interpreter, prefix-less staging); a test proves that user cannot read /tests, the expectations, the shipped copy or /logs/verifier, and the delivered driver is byte-compared before and after candidate code. Oracle scores 1 and the unmodified package 0 (it fails sixteen of eighteen tests). Each departure reverted alone, the three natural over-repairs of the kept behaviours, a tampered driver, a package that reads the sealed answers, and twenty Sound Verifier mutants (caps, floors, half-even and half-away rounding, noon or midnight misclassed, overwritten day totals, a lost reading treated as unread, sorted stations) all score 0 on their own named test; exact Fraction rounding and integer JSON numbers for whole-degree figures score 1."
relevant_experience = "Background in surface climatology and cooperative-observer data processing: observation-day conventions for morning and afternoon observers, accumulated gauge amounts, traces, degree days on the 65 F base, monthly means and completeness rules as earth-science practice, plus experience writing independent reference models and privilege-separated pytest verifiers for Python data packages."

