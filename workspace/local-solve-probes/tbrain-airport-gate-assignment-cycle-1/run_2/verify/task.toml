expert_time_estimate_hours = 6
difficulty_explanation = "Each day is a stand-allocation problem on a realistic apron layout: 180-360 aircraft turns on 31-63 stands, with stand size limits, border-control stands for international turns, a buffer between turns on one stand, and wingtip pairs of neighbouring stands that cannot both hold widebodies at once. The cost is transfer-passenger walking between the stands of connecting turns plus a per-passenger bus charge for remote stands, so it is a quadratic assignment problem layered on interval scheduling: the value of a stand for one turn depends on where every connecting turn is, and moving one turn usually means moving the turns it collides with. An apron planner has to build a search that works on this coupling (moving chains of turns, swapping what two stands hold over a time window) while keeping every move feasible. The shipped first-free-stand planner costs 22-41 percent over target, and the targets come from hours of annealing per day, so a short or single-move search stops well above them. The days are synthetic but modelled on a three-pier terminal with a remote apron."
solution_explanation = "The reference plans come from simulated annealing over the stand rules with four moves: move a turn to another stand it fits and is free on, swap the stands of two turns, put a turn on a stand and re-place the turns it collides with on their cheapest free stands, and exchange everything two stands hold inside a time window. Runs started from the shipped planner, then from the cheapest plan so far: several 40-minute seeds, iterated shorter anneals at varied starting temperatures, and finally single anneals of two and four hours, which kept improving the larger days by 0.1-0.6 percent a round. Each target is the cost of the cheapest plan seen. solve.sh copies the four plans and runs the checker on each."
verification_explanation = "The verifier reads the four plan files as JSON data and scores them with its own copy of the checker, days and targets, so nothing the agent edits under /app affects grading and no candidate code runs. The verifier keeps each day as a gzip-compressed copy of /app/days/<day>.json and fails if its SHA-256 or its stand, turn and transfer counts differ from a roster. For each day one test checks that the plan is valid (standard JSON within the stated limits, every turn placed exactly once on a known stand, size, border control, buffer and wingtip rules) and one checks that its integer cost is at or below the target. The reference plans sit exactly on the targets; the shipped planner's plans cost 9077225, 12189855, 14519325 and 21326260 against targets of 7439665, 9153275, 10331305 and 15767540."
relevant_experience = "Airport operations research: stand and gate allocation with transfer-passenger walking costs, aircraft size and border-control constraints, and local-search and annealing methods for daily apron planning."

