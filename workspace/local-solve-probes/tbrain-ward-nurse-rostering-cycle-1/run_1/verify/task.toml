tags = ["nurse-rostering", "workforce-scheduling", "constraint-optimisation", "metaheuristics", "healthcare-operations"]
expert_time_estimate_hours = 6
difficulty_explanation = "Each ward is a four-week nurse roster for 16-36 nurses of three grades over early, late and night shifts. Hard rules (minimum cover with registered and senior nurses on every shift, leave, rest between shifts, at most six days in a row, two rest days after a run of nights) make most local changes infeasible, and the soft penalty trades preferred cover against contracted hours, night limits, split and excess weekends, isolated working days and personal requests. The rules interact across days and across nurses: fixing one nurse's weekend moves cover onto someone else, whose rest after nights then blocks a request three days later. A rostering expert has to build a search that moves blocks of shifts between nurses while tracking the hard rules incrementally; the shipped fill-the-gaps planner is valid but costs 7-12 times the target, and the targets are the cheapest rosters from multi-hour annealing runs pooled with the best rosters from trial runs, so a short search stops above at least one of them. The wards are synthetic but use typical NHS-style contract and cover rules."
solution_explanation = "The reference rosters come from simulated annealing in which a hard-rule breach costs 5000 and only rosters with no breach are kept. Moves: set one nurse's code on one day, swap two nurses' codes on one day, swap a block of two to seven days between two nurses, and rotate a block of one nurse's row by a day. Runs started from the shipped planner: several seeds, iterated shorter anneals restarted from the best roster at varied temperatures, and fresh single anneals of one to four hours; the best rosters from trial runs were pooled in and the searches restarted from them. Each target is the penalty of the cheapest roster seen. solve.sh copies the four rosters and runs the checker on each."
verification_explanation = "The verifier reads the four roster files as JSON data and scores them with its own copy of the checker, wards and targets, so nothing the agent edits under /app affects grading and no candidate code runs. For each ward one test checks that the roster is valid (standard JSON within the stated limits, every nurse present with one of E, L, N or . per day, cover, grade, leave, rest, consecutive-day and after-night rules) and one checks that its integer penalty is at or below the target. The reference rosters sit exactly on the targets; the shipped planner's rosters score 5313, 12003, 9002 and 12287 against targets of 440, 1070, 820 and 1650."
relevant_experience = "Workforce scheduling and optimisation: hospital nurse rostering with cover, rest and contract rules, soft-constraint penalty models, and annealing and neighbourhood search for rota planning."

