[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "advanced"
category = "Software"
subcategory = "Languages"
languages = ["python"]
tags = ["gnu-sed", "posix-regex", "leftmost-longest", "stream-editor", "reimplementation"]
expert_time_estimate_hours = 12
difficulty_explanation = "A drop-in GNU sed 4.9 has to reproduce a whole stream-editor semantics from its manual with no sed to compare against: a script parser with sed's quirky text, label and delimiter rules; the cycle model with pattern and hold space, the append queue, n/N at end of input, D restarts without reading, and the t flag's reset on every read; every address form, including per-file numbering under -s and the GNU range forms; and a regular-expression engine for BRE and ERE with GNU escapes and back-references that takes the leftmost match and then the longest one, which Python's own re does not do. The expertise is knowing which details the manual actually pins down and reading them exactly, for instance that addr1,~N runs to the next multiple of N after addr1 even when addr1 is itself a multiple, and that a script whose first two characters are #n turns on -n. A capable engineer who implements from memory of sed rather than from the manual gets those wrong while everything else passes."
solution_explanation = "The reference is a standard-library implementation in two files: posixre.py parses GNU BRE and ERE into a tree and matches it with an exhaustive backtracking search that keeps the leftmost start and the longest end, taking groups from the first path that reaches that end; sed.py parses scripts (addresses, blocks, labels, a/i/c text, s and y) and runs the sed cycle with pattern and hold space, the append queue, D restarts, n/N at end of input, the t flag reset on each read, per-file numbering and ranges under -s, q/Q exit codes and l line wrapping."
verification_explanation = "A separate verifier image holds 866 cases (options, script, input and optional files, including a missing one). For every case the verifier runs the image's own GNU sed 4.9 as root to get the expected standard output and exit status, then runs /app/pysed/sed.py as an unprivileged user in a fresh directory with LC_ALL=C and compares stdout byte for byte and the exit status. The sed binary is made root-only first, so the candidate cannot delegate to it. Cases are grouped into one named test per area of the manual plus four buckets of mixed generated scripts; every case uses only behaviour the manual describes."
relevant_experience = "Years of Unix tooling and text-processing work: writing and debugging sed and awk pipelines, porting shell tooling to minimal containers, and implementing regular-expression engines with POSIX leftmost-longest semantics."

