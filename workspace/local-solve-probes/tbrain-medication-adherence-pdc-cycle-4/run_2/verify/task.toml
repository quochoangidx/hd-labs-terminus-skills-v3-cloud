expert_time_estimate_hours = 3
difficulty_explanation = "This is the work of a pharmacy quality analyst at a health plan who keeps the plan's adherence-measure code honest against its written specification. The package carries the slips such code really accumulates. It starts a fill's coverage the day after dispensing, and never carries an early refill of the same drug past the supply still on hand. It takes the index date from the first line in export order and counts two packs picked up on one day as two fill dates. It has no 2 October entry test and ends the treatment period at the last covered day, so a member who stopped in March looks adherent. It leaves inpatient stay days in the denominator, rounds percentages down, treats a PDC of exactly 80.0 as non-adherent (and counts members outside the measure as adherent), and divides a large class's rate by every member rather than by the members in the measure. The harder half is knowing where the specification stops. Its treatment period and period days exist only for a member in the measure, its rate base only for a reportable class of ten or more, and its coverage length only for a fill within the 100-day supply limit. For each of these, the step the code takes today has to stay while everything around it is repaired. The natural over-repairs apply the year-end treatment period and the stay-day subtraction to every member, divide every class by its members in the measure (or blank a small class), or give an over-limit fill its full supply or no coverage at all. Separately, a claim line keyed with no days supply is not a fill under 2.1. The shipped filter for it sits inside the index-date and measure-test expressions that the departures force the solver to rewrite, and dropping that filter moves the index date and the measure test. No real claims are used. The claims files are synthetic, shaped like PBM claim extracts, with hand-built files that sit on every limit."
solution_explanation = "The reference patch starts each fill on its fill date and carries an early refill of the same drug to the day after that drug's earlier coverage ends, taking fills of one date in file order; fills of different drugs never move one another. It takes the index date as the earliest fill date, ignoring lines with no days supply, and puts a member in the measure only with fills on two different dates and an index date no later than 2 October. For a member in the measure it measures to 31 December and takes stay days out of both the period days and the covered days. It rounds every PDC and rate to the nearest tenth, half up, and judges adherence as in the measure with a reported PDC of 80.0 or more. A reportable class divides by its members in the measure. Where the specification gives no rule it keeps today's step: a member outside the measure keeps today's span (index date to the last covered day, stay days left in the span), a class below ten keeps today's divisor (every member with a fill), and a fill above the supply limit still covers 100 days. With at most 366 period days no PDC falls between 79.95 and 80, and every exact half tenth is a binary-exact float, so float half-up rounding is exact. The driver is untouched."
verification_explanation = "A separate verifier image records the delivered driver's bytes, puts its own copy on /app/tools/pdc_run.py, seals /app as root-owned, and runs the documented command against the delivered /app/src. Each run is made as an unprivileged user in its own session with an isolated interpreter, on each claims file staged under the same neutral name in a fresh directory. It compares every key the README lists: pdc and rate must be the reported tenth, and everything else must be equal and of the same JSON type. Expected reports were sealed ahead of time into tests/expected by solution/seal.py from solution/model.py, a model written from the specification that never imports the package, and are pinned by SHA-256 and row count in tests/expected/ROSTER. There are 21 tests over 22 sealed files: one named test per rule, one for each figure the specification leaves to today's code, one combining those three, a limits test, a seeded family and two harness tests. The figures left to today's code are graded only in their own tests: period, covered days and PDC of members outside the measure, the rate of a class below ten, and lines above the supply limit. Every other test compares all other figures. The outside-the-measure and above-limit tests also run a copy of the shipped package, owned by its own user, on six file pairs as a differential. Named files include fills on 1 January, 29 February and 31 December, and index dates of 1, 2 and 3 October in 2000, 2023 and 2024. They also include refills early by a day and by months, two fills of one drug on one day, lines exported out of date order, and claim lines with no days supply. Stays range from a single day to one stay of sixty days, including sixty stay days that leave 31 period days. PDCs sit on 1.25, 33.75 and exactly 80.0, and rates on 6.25 and 43.75. Every rule 1.3 limit is reached at both ends: years 2000 and 2099, 100 members, 40 class codes, a 400-line member, days supply 0 and 365, 10 stays and 60 stay days. The seeded family is also measured under labels drawn at run time from os.urandom: new plan, ids, drug and class codes, shuffled members and lines, and the year moved 28 years. The draw is printed with any failure. Locally the Oracle scores 1 and the unfixed package 0. Forty-one one-edit mutants of the reference each fail their own test, among them every departure reverted, the natural over-repairs of each silent figure, cutoffs of 1 and 3 October, half-even and floor rounding, and caps at 99 members, 399 lines and 9 stays. Three contract-valid alternatives score 1: exact Fraction rounding, extra keys with an integral PDC written as an integer, and carry-over written as a max. A test proves the candidate cannot read /tests, the expectations, the shipped copy or /logs/verifier, and the driver is byte-checked before and after candidate code."
relevant_experience = "Pharmacy quality analytics at a health plan: building and auditing proportion-of-days-covered adherence measures from PBM claim extracts, index-date and denominator rules, early-refill carry-over, inpatient-stay adjustments, and the class-level adherence rates reported for quality ratings."

