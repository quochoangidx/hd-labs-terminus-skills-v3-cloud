<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snorkel Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Snorkel Sync</h1>
      <span id="loginBadge" class="badge badge-unknown">Sẵn sàng</span>
    </header>

    <main>
      <label for="projectSelect">Project cần đồng bộ <span class="req">*</span></label>
      <select id="projectSelect" disabled>
        <option value="">— Bấm "Tải danh sách project" —</option>
      </select>

      <button id="reloadBtn" class="primary">Tải danh sách project</button>
      <button id="syncBtn" class="primary" disabled>Đồng bộ</button>

      <p id="status" class="status"></p>

      <p class="hint">
        Token đăng nhập được tự lấy từ session khi bạn mở trang Snorkel — không
        cần dán thủ công.
      </p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
